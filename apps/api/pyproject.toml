[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "issuepilot-api"
version = "0.1.0"
description = "Backend for the IssuePilot GitHub issue-to-patch agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "openai>=2.0.0",
  "pydantic>=2.11.0",
  "uvicorn>=0.35.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
